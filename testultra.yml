esp8266:
  board: d1_mini
  framework:
    version: recommended

esphome:
  name: testultra
    


# Enable logging
logger:

wifi:
  networks:
  - ssid: !secret GKssid
    password: !secret GKpassword
  - ssid: !secret BGssid
    password: !secret BGpassword
  - ssid: !secret SSssid
    password: !secret SSpassword
  ap:
    ssid: !secret FBssid
    password: !secret FBpassword

  # Enable fallback hotspot (captive portal) in case wifi connection fails
captive_portal:


ota:
  - platform: esphome

# Enable Home Assistant API
api:
  reboot_timeout: 60min  # Neustart, wenn HA 60 min nicht verbunden ist; 0s = nie

time:
  - platform: homeassistant
    id: ha_time

text_sensor:
  - platform: version
    name: "ESPHome Version"

binary_sensor:
  - platform: status
    name: "Statussensor"
    id: statussensor

sensor:  
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""


  - platform: ultrasonic
    trigger_pin: D1 
    echo_pin: D5
    name: "Ultrasonic Sensor"
    update_interval: 5s
    timeout: 5m 
#    pulse_time: 15us