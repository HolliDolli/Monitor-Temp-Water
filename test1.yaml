sensor:
  - platform: dallas_temp
#    address: 0x7d592f7f0e64ff28 brauchen wir nicht mehr. gibt ja jetzt index :-)
    index: 0
    name: Ruecklauf
    id: ruecklauf 
    update_interval: 30s
  - platform: dallas_temp
    index: 1
    name: RaumTemp
    id: raumtemp 
    update_interval: 30s
  - platform: dallas_temp
    index: 2
    name: Zulauf
    id: zulauf 
    update_interval: 30s
  - platform: dallas_temp
    index: 3
    name: Vorlauf
    id: vorlauf 
    update_interval: 30s

  - platform: homeassistant
    name: "Außentemperatur"
    entity_id: sensor.tempext
    id: aussentemp

  - platform: template
    name: "VL-RL Differenz"
    id: vl_rl_diff
    unit_of_measurement: "°C"
    update_interval: 15s
    lambda: |-
      if (isnan(id(vorlauf).state) || isnan(id(ruecklauf).state)) return NAN;
      return id(vorlauf).state - id(ruecklauf).state;

  - platform: template
    name: "Heizkurve Sollvorlauf"
    id: soll_vorlauf
    unit_of_measurement: "°C"
    update_interval: 30s
    lambda: |-
      if (isnan(id(aussentemp).state)) return NAN;
      float at = id(aussentemp).state;

      float kurve[6][2] = {
        {id(sp1_at).state, id(sp1_vl).state},
        {id(sp2_at).state, id(sp2_vl).state},
        {id(sp3_at).state, id(sp3_vl).state},
        {id(sp4_at).state, id(sp4_vl).state},
        {id(sp5_at).state, id(sp5_vl).state},
        {id(sp6_at).state, id(sp6_vl).state},
      };

      if (at <= kurve[0][0]) return kurve[0][1];
      if (at >= kurve[5][0]) return kurve[5][1];

      for (int i = 0; i < 5; i++) {
        if (at >= kurve[i][0] && at <= kurve[i+1][0]) {
          float t = (at - kurve[i][0]) / (kurve[i+1][0] - kurve[i][0]);
          return kurve[i][1] + t * (kurve[i+1][1] - kurve[i][1]);
        }
      }
      return NAN;

  - platform: template
    name: "Vorlauf Trend"
    id: vl_trend
    unit_of_measurement: "°C/3min"
    update_interval: 15s
    lambda: |-
      if (id(puffer_gefuellt) < 12) return NAN;
      float werte[12] = {
        id(vl_h0),  id(vl_h1),  id(vl_h2),
        id(vl_h3),  id(vl_h4),  id(vl_h5),
        id(vl_h6),  id(vl_h7),  id(vl_h8),
        id(vl_h9),  id(vl_h10), id(vl_h11)
      };
      int idx = id(vl_idx);
      float aeltester = werte[(idx + 1) % 12];
      float neuester  = werte[idx];
      return neuester - aeltester;


switch:
  - platform: gpio
    pin: 32
    name: "Mischer Auf"
    id: mischer_auf
    interlock: [mischer_zu]
    interlock_wait_time: 200ms

  - platform: gpio
    pin: 33
    name: "Mischer Zu"
    id: mischer_zu
    interlock: [mischer_auf]
    interlock_wait_time: 200ms

  - platform: template
    name: "Mischer Override aktiv"
    id: override_aktiv
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.stop: regelung
      - script.stop: fahre_auf
      - script.stop: fahre_zu
      - switch.turn_off: mischer_auf
      - switch.turn_off: mischer_zu
      - logger.log: "Override aktiviert – Automatik gestoppt"
    on_turn_off:
      - logger.log: "Override deaktiviert – Automatik läuft wieder"

select:
  - platform: template
    name: "Mischer Override Richtung"
    id: override_richtung
    optimistic: true
    options:
      - "STOP"
      - "AUF"
      - "ZU"
    initial_option: "STOP"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            if (!id(override_aktiv).state) return;
            auto val = id(override_richtung).current_option();
            if (val == "AUF") {
              id(fahre_auf).execute();
            } else if (val == "ZU") {
              id(fahre_zu).execute();
            } else {
              id(mischer_auf).turn_off();
              id(mischer_zu).turn_off();
            }

