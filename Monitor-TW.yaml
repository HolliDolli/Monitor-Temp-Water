    entity_id: weather.openweathermap
    attribute: wind_speed
    unit_of_measurement: "km/h"
    state_class: measurement
    internal: false
  # 2026-10-23 ÄNDERUNG Ende: HZG Sensoren der Raumregelung
script:

  - id: ha_mischer_zu
    mode: single
    then:
      - homeassistant.service:
          service: cover.close_cover
          data:
            entity_id: cover.rollaktor1

  - id: ha_mischer_auf
    mode: single
    then:
      - homeassistant.service:
          service: cover.open_cover
          data:
            entity_id: cover.rollaktor1

  - id: ha_mischer_stop
    mode: single
    then:
      - homeassistant.service:
          service: cover.stop_cover
          data:
            entity_id: cover.rollaktor1


  - id: fahre_zu
    mode: single
    then:
      - lambda: |-
          // fahre_zu, analog fahre_auf mit +
          if (!isnan(id(rollaktor1_position_ist).state)) {
            id(mischer_position_ms) = (int)round(id(rollaktor1_position_ist).state * 1200.0f);
          }
          if (id(mischer_position_ms) <= 0) {
            ESP_LOGW("mischer", "Anschlag ZU erreicht, fahre nicht weiter");
            return;
          }
          int schritt_ms  = id(override_aktiv).state ? (int)id(override_schrittweite).state : 3000;
          int neue_pos_ms = max(0, id(mischer_position_ms) - schritt_ms);
          int ziel_pct    = (int)round(neue_pos_ms / 1200.0f);
          id(mischer_fahre_position).execute(ziel_pct);
          id(mischer_position_ms) = neue_pos_ms;
          id(letzte_fahrtrichtung) = -1;

  - id: fahre_auf
    mode: single
    then:
      - lambda: |-
          // fahre_zu, analog fahre_auf mit +
          if (!isnan(id(rollaktor1_position_ist).state)) {
            id(mischer_position_ms) = (int)round(id(rollaktor1_position_ist).state * 1200.0f);
          }
          if (id(mischer_position_ms) <= 0) {
            ESP_LOGW("mischer", "Anschlag ZU erreicht, fahre nicht weiter");
            return;
          }
          int schritt_ms  = id(override_aktiv).state ? (int)id(override_schrittweite).state : 3000;
          int neue_pos_ms = max(0, id(mischer_position_ms) + schritt_ms);
          int ziel_pct    = (int)round(neue_pos_ms / 1200.0f);
          id(mischer_fahre_position).execute(ziel_pct);
          id(mischer_position_ms) = neue_pos_ms;
          id(letzte_fahrtrichtung) = +1;
 
  - id: mischer_fahre_position
    mode: restart
    parameters:
      zielposition: int
    then:
      - homeassistant.service:
          service: cover.set_cover_position
          data:
            entity_id: cover.rollaktor1
          variables:
            ziel_var: !lambda 'return zielposition;'
          data_template:
            position: '{{ ziel_var }}'
 
  - id: puffer_schreiben
    mode: single
    then:
      - lambda: |-
          if (isnan(id(vorlauf).state)) return;
          int idx = id(vl_idx);
          float val = id(vorlauf).state;

          switch(idx) {
            case  0: id(vl_h0)  = val; break;
            case  1: id(vl_h1)  = val; break;
            case  2: id(vl_h2)  = val; break;
            case  3: id(vl_h3)  = val; break;
            case  4: id(vl_h4)  = val; break;
            case  5: id(vl_h5)  = val; break;
            case  6: id(vl_h6)  = val; break;
            case  7: id(vl_h7)  = val; break;
            case  8: id(vl_h8)  = val; break;
            case  9: id(vl_h9)  = val; break;
            case 10: id(vl_h10) = val; break;
            case 11: id(vl_h11) = val; break;
          }
          id(vl_idx) = (idx + 1) % 12;
          if (id(puffer_gefuellt) < 12)
            id(puffer_gefuellt) = id(puffer_gefuellt) + 1;
          // Zulauf-Historie schieben
          id(zl_prev2) = id(zl_prev1);
          id(zl_prev1) = id(zulauf).state;


  # 2026-10-23 ÄNDERUNG Anfang: HZG äußerer Kreis (Raumtemperatur -> Korrektur des Soll-Vorlaufs), läuft vor "regelung"
  - id: hzg_aussen
    mode: single
    then:
      - lambda: |-
          // 2026-10-23 Konstanten
          const float FROST_MIN = ${HZG_FROST_MIN};  // Untergrenze Raum-Soll in der Absenkung
          const float KP_RAUM   = 3.0f;      // K Vorlauf pro K Raumfehler (sofort wirksam, begrenzt auf +-10 K)
          const float ALPHA_F   = 0.02f;     // Filter Raumtemperatur pro 15-s-Zyklus (ca. 12 min Zeitkonstante)
          const float ALPHA_I   = 0.0025f;   // Lernrate der Tabelle pro Zyklus und K Fehler (ca. 0,6 K/h je K)
          uint32_t jetzt = millis();

          // 2026-10-23 Modus-Auswahl und Power-Zeitlimit
          int idx = id(hzg_betriebsmodus).active_index().value_or(0);
          if (idx == 2 && (uint32_t)(jetzt - id(hzg_power_start)) > (uint32_t)(id(hzg_power_dauer).state * 60000.0f)) {
            id(hzg_betriebsmodus).make_call().set_index(0).perform();
            idx = 0;
          }
          if (idx == 2) {
            id(hzg_power_zuletzt) = jetzt;
            id(hzg_power_gesehen) = true;
          } else {
            id(hzg_power_gesendet) = false;
            id(hzg_power_vlmax) = false;
          }

          // 2026-10-23 Fensterkontakt: solange offen, Zeitpunkt nachführen
          if (id(hzg_fenster).state) {
            id(hzg_fenster_ms) = jetzt;
            id(hzg_fenster_gesehen) = true;
          }

          // 2026-10-23 Raumtemperatur filtern, Sensor gilt bis 20 min nach dem letzten gültigen Wert
          float ist_roh = id(egwz_raumtemp).state;
          bool roh_ok = !isnan(ist_roh) && ist_roh > 5.0f && ist_roh < 35.0f;
          if (roh_ok) {
            if (!id(hzg_raum_f_ok)) {
              id(hzg_raum_f) = ist_roh;
              id(hzg_raum_f_ok) = true;
            } else {
              id(hzg_raum_f) += ALPHA_F * (ist_roh - id(hzg_raum_f));
            }
            id(hzg_sensor_ms) = jetzt;
            if (id(hzg_sensor_ms) == 0) id(hzg_sensor_ms) = 1;
          }
          bool sensor_ok = id(hzg_raum_f_ok) && id(hzg_sensor_ms) != 0 && (uint32_t)(jetzt - id(hzg_sensor_ms)) < 1200000UL;

          // 2026-10-23 Heizzeit, Minuten bis zum Beginn der Heizzeit
          bool in_heizzeit = true;
          int min_bis_von = 0;
          auto zeit = id(ha_time).now();
          if (zeit.is_valid()) {
            int jetzt_min = zeit.hour * 60 + zeit.minute;
            int von = id(hzg_heizzeit_von).hour * 60 + id(hzg_heizzeit_von).minute;
            int bis = id(hzg_heizzeit_bis).hour * 60 + id(hzg_heizzeit_bis).minute;
            if (von == bis)     in_heizzeit = true;
            else if (von < bis) in_heizzeit = (jetzt_min >= von && jetzt_min < bis);
            else                in_heizzeit = (jetzt_min >= von || jetzt_min < bis);
            min_bis_von = (von - jetzt_min + 1440) % 1440;
          }

          float wunsch = id(hzg_wunschtemp).state;
          float absenk = id(hzg_absenkung).state;

          // 2026-10-23 Aufheizen: Beginn so, dass zu "von" die Wunschtemperatur erreicht ist. Einmal gestartet bleibt es bis "von"
          float diff_auf = sensor_ok ? max(0.0f, wunsch - id(hzg_raum_f)) : 0.0f;
          float auf_min  = min(240.0f, id(hzg_k_auf) * diff_auf);
          id(hzg_aufheiz_min) = auf_min;
          if (in_heizzeit) {
            id(hzg_aufheizen) = false;
          } else if (id(hzg_aufheizen) && min_bis_von > 300) {
            id(hzg_aufheizen) = false;
          } else if (!id(hzg_aufheizen) && auf_min > 0.0f && min_bis_von <= (int) auf_min) {
            id(hzg_aufheizen) = true;
          }

          // 2026-10-23 Modus: 0 Aus, 1 Heizen, 2 Absenken, 3 Aufheizen, 4 Party, 5 Power, 6 Fallback
          int modus;
          if (idx == 2)                              modus = 5;
          else if (!id(hzg_regelung_aktiv).state)    modus = 0;
          else if (!sensor_ok || !id(hzg_geladen))   modus = 6;
          else if (idx == 1)                         modus = 4;
          else if (in_heizzeit)                      modus = 1;
          else if (id(hzg_aufheizen))                modus = 3;
          else                                       modus = 2;

          float soll_raum = wunsch;
          if (modus == 2) soll_raum = max(FROST_MIN, wunsch - absenk);

          // 2026-10-23 Aufheizzeit nachführen: Beim Übergang in die Heizzeit zu kalt = früher beginnen, deutlich zu warm = später
          if (id(hzg_modus_prev) != 1 && modus == 1 && (id(hzg_modus_prev) == 2 || id(hzg_modus_prev) == 3)) {
            float f = soll_raum - id(hzg_raum_f);
            if (f > 0.5f)       id(hzg_k_auf) = min(120.0f, id(hzg_k_auf) * 1.15f);
            else if (f < -0.3f) id(hzg_k_auf) = max(10.0f, id(hzg_k_auf) * 0.9f);
            ESP_LOGI("hzg", "Heizzeit beginnt: Raumfehler=%.2f -> Aufheizzeit %.1f min/K", f, id(hzg_k_auf));
          }
          id(hzg_modus_prev) = modus;

          // 2026-10-23 Korrektur des Soll-Vorlaufs: P-Anteil sofort, I-Anteil in der Tabelle (nur im Heizen/Party gelernt)
          float korr = 0.0f;
          float fehler = sensor_ok ? (soll_raum - id(hzg_raum_f)) : 0.0f;
          bool lern = false;
          float at = id(aussentemp).state;
          if ((modus == 1 || modus == 2 || modus == 3 || modus == 4) && !isnan(at)) {
            float p = (at + 10.0f) / 5.0f;
            p = max(0.0f, min(5.0f, p));
            int i0 = min(4, (int) p);
            float w1 = p - (float) i0;
            float w0 = 1.0f - w1;
            float tab = w0 * id(hzg_tab)[i0] + w1 * id(hzg_tab)[i0 + 1];
            float kp = max(-10.0f, min(10.0f, KP_RAUM * fehler));
            korr = max(-15.0f, min(15.0f, tab + kp));

            int pr = id(letzte_prioritaet);
            // 2026-10-23 Korrektur (Anti-Windup): nur lernen, wenn VL dem Soll-VL folgt und der Soll-VL physikalisch erreichbar ist (über RL)
            float vl_i = id(vorlauf).state;
            float rl_i = id(ruecklauf).state;
            float svl  = id(hzg_soll_vl_eff);
            bool folgt = !isnan(vl_i) && !isnan(rl_i) && svl > 0.0f
                         && fabsf(vl_i - svl) < 2.0f && svl >= rl_i + 2.0f;
            // 2026-10-23 Fenster: kein Lernen bei offenem Fenster und bis 30 min nach dem Schließen (Lüften ist kein Heizbedarf)
            bool fenster_ruhe = !id(hzg_fenster_gesehen) || (uint32_t)(jetzt - id(hzg_fenster_ms)) > 1800000UL;
            bool power_nachlauf = id(hzg_power_gesehen) && (uint32_t)(jetzt - id(hzg_power_zuletzt)) < 7200000UL;
            lern = (modus == 1 || modus == 4) && id(ventil_offen).state && !id(override_aktiv).state
                   && (pr == 0 || pr == 1 || pr == -1) && !power_nachlauf && id(hzg_geladen) && folgt && fenster_ruhe;
            if (lern) {
              float d = ALPHA_I * fehler;
              id(hzg_tab)[i0]     = max(-15.0f, min(15.0f, id(hzg_tab)[i0]     + w0 * d));
              id(hzg_tab)[i0 + 1] = max(-15.0f, min(15.0f, id(hzg_tab)[i0 + 1] + w1 * d));
            }
          }
          id(hzg_lernen) = lern;
          id(hzg_korr) = korr;
          id(hzg_fehler) = fehler;
          id(hzg_soll_raum) = soll_raum;
          id(hzg_modus_nr) = modus;
          ESP_LOGD("hzg", "Modus=%d Raum-Soll=%.1f Raum-Ist(gefiltert)=%.2f Fehler=%.2f Korrektur=%.2f Lernen=%d Aufheizzeit=%.0f min",
                   modus, soll_raum, id(hzg_raum_f), fehler, korr, lern ? 1 : 0, auf_min);

          // 2026-10-23 Sichern nach HA: höchstens alle 30 min und nur bei Änderung, nie vor dem Laden
          if (id(hzg_geladen) && (uint32_t)(jetzt - id(hzg_save_ms)) > 1800000UL) {
            char buf[80];
            snprintf(buf, sizeof(buf), "%.2f;%.2f;%.2f;%.2f;%.2f;%.2f;%.1f",
                     id(hzg_tab)[0], id(hzg_tab)[1], id(hzg_tab)[2], id(hzg_tab)[3], id(hzg_tab)[4], id(hzg_tab)[5], id(hzg_k_auf));
            id(hzg_save_ms) = jetzt;
            if (id(hzg_save_str) != std::string(buf)) {
              id(hzg_save_str) = std::string(buf);
              id(hzg_save_noetig) = true;
            }
          }
      - if:
          condition:
            lambda: 'return id(hzg_save_noetig);'
          then:
            - homeassistant.service:
                service: input_text.set_value
                data:
                  entity_id: input_text.hzg_lerntabelle
                  value: !lambda 'return id(hzg_save_str);'
            - lambda: 'id(hzg_save_noetig) = false;'
  # 2026-10-23 ÄNDERUNG Ende: HZG äußerer Kreis
  - id: regelung
    mode: single
    then:
      - lambda: |-


          // Sicherheitschecks
          id(letzte_prioritaet) = 100;
          if (!id(boot_fertig)) return;  // erst mit Regeln beginnen, wenn der boot abgeschlossen.
          id(letzte_prioritaet) = 99;
          if (id(override_aktiv).state) return;
          id(letzte_prioritaet) = 98;
          id(letzte_prioritaet) = 97;
          id(letzte_prioritaet) = 96;
          if (isnan(id(vorlauf).state))    return;
          id(letzte_prioritaet) = 95;
          if (isnan(id(ruecklauf).state))  return;
          id(letzte_prioritaet) = 94;
          if (isnan(id(aussentemp).state)) return;
          id(letzte_prioritaet) = 93;
          if (isnan(id(zulauf).state))     return;
          id(letzte_prioritaet) = 92;
          if (isnan(id(soll_vorlauf).state)) return;
          id(letzte_prioritaet) = 91;

          ESP_LOGI("regelung", "Sicherheitschecks beendet");

          if (!isnan(id(rollaktor1_position_ist).state)) {
            id(mischer_position_ms) = (int)round(id(rollaktor1_position_ist).state * 1200.0f);
          }

          float vl  = id(vorlauf).state;
          float rl  = id(ruecklauf).state;
          float at  = id(aussentemp).state;
          float zl  = id(zulauf).state;
          if (rl > vl) rl = vl - 0.1f;
          float diff = vl - rl;

          // -------------------------------------------------------
          // BLOCK 1: Alle Berechnungen (immer ausführen)
          // -------------------------------------------------------

          // Heizkurve + Spreizungskorrektur
          float soll_vl = id(soll_vorlauf).state;
          // 2026-10-23 ÄNDERUNG Anfang: HZG Korrektur aus dem äußeren Kreis auf den Soll-Vorlauf aufschlagen (ohne Raumregelung ist hzg_korr = 0)
          if (id(hzg_korr) != 0.0f) {
            soll_vl = max(20.0f, min(id(vorlauf_max).state - 2.0f, soll_vl + id(hzg_korr)));
          }
          id(hzg_soll_vl_eff) = soll_vl;
          // 2026-10-23 ÄNDERUNG Ende: HZG Korrektur
          float spreizungsfehler = diff - 12.0f;
          float spreizungskorrektur = max(-5.0f, min(5.0f, spreizungsfehler * 0.5f));
          // Wir nehmen die Spreizungskorrektur mal raus. Sinnhaftigkeit ist nicht gesichert.
          //soll_vl = soll_vl + spreizungskorrektur;
          id(soll_vl_korrigiert) = soll_vl;
          ESP_LOGD("regelung", "AT=%.1f -> Soll-VL=%.1f; Spreizung=%.1f -> Korrektur=%.1f -> korr. Soll=%.1f; Ist-VL=%.1f",
                   at, id(soll_vorlauf).state, diff, spreizungskorrektur, soll_vl, vl);

          // 2026-10-12 ÄNDERUNG Anfang: PID durch Integrator mit Prädiktion ersetzt (Ki, Kd, Feedforward und alte Positionsrechnung entfallen)
          // 2026-10-12 Position des Mischers in % (aus dem Rollaktor-Ist, siehe oben)
          float pos_ist = id(mischer_position_ms) / 1200.0f;
          // 2026-10-12 Nach Eingriffen von außen (manuell, Heizgrenze, Vorlauf-Max) die Zielposition an das Ist angleichen
          if (fabsf(pos_ist - id(pos_ziel)) > 5.0f) {
            id(pos_ziel) = pos_ist;
          }
          // 2026-10-12 Vorlauftrend (K pro ca. 3 min) fortschreiben, damit die Totzeit der Strecke berücksichtigt wird
          float trend   = isnan(id(vl_trend).state) ? 0.0f : id(vl_trend).state;
          float vl_pred = vl + trend * id(vl_horizont).state;
          float fehler  = soll_vl - vl_pred;
          // 2026-10-12 Geloggt wird als "PID Ausgang" jetzt der Prädiktionsfehler in K
          id(pid_letzter_ausgang) = fehler;
          ESP_LOGD("regelung", "VL=%.1f Trend=%.2f -> VL-Prognose=%.1f; Soll=%.1f -> Fehler=%.2f; Pos-Ist=%.1f%% Pos-Ziel=%.1f%%",
                   vl, trend, vl_pred, soll_vl, fehler, pos_ist, id(pos_ziel));
          // 2026-10-12 ÄNDERUNG Ende: PID durch Integrator mit Prädiktion ersetzt

          ESP_LOGI("regelung", "Berechnungen abgeschlossen");

          // -------------------------------------------------------
          // BLOCK 2: Prioritäten und Aktionen
          // -------------------------------------------------------

          // 2026-10-23 ÄNDERUNG Anfang: HZG Powerbetrieb: Regelung ausgesetzt, Mischer voll auf. P60 (Vorlauf-Max) und P50 (Kessel-Schutz) bleiben aktiv, Heizgrenze (P70) und P80 gelten nicht
          if (id(hzg_betriebsmodus).active_index().value_or(0) == 2) {
            // 2026-10-23 Korrektur: Hysterese 5 K, damit der Mischer nicht zwischen ZU und 100 % pendelt
            if (vl >= id(vorlauf_max).state && !id(hzg_power_vlmax)) {
              id(hzg_power_vlmax) = true;
              ESP_LOGW("regelung", "P60 (Power): Vorlauf-Max erreicht (VL=%.1f) -> sofort ZU", vl);
              id(hzg_power_gesendet) = false;
              id(ha_mischer_stop).execute();
              id(ha_mischer_zu).execute();
            }
            if (id(hzg_power_vlmax)) {
              if (vl < id(vorlauf_max).state - 5.0f) {
                id(hzg_power_vlmax) = false;
              } else {
                id(letzte_prioritaet) = 60;
                return;
              }
            }
            if (zl < id(kessel_min).state) {
              id(letzte_prioritaet) = 50;
              ESP_LOGW("regelung", "P50 (Power): Kessel kann nicht liefern (ZL=%.1f) -> nicht öffnen", zl);
              id(hzg_power_gesendet) = false;
              id(ha_mischer_stop).execute();
              return;
            }
            id(letzte_prioritaet) = 85;
            id(pos_ziel) = 100.0f;
            if (!id(hzg_power_gesendet)) {
              ESP_LOGI("regelung", "P85: Powerbetrieb -> Mischer auf 100%% (Ist %.1f%%)", pos_ist);
              id(mischer_fahre_position).execute(100);
              id(mischer_position_ms) = 120000;
              id(letzte_fahrtrichtung) = 1;
              id(hzg_power_gesendet) = true;
            }
            return;
          }
          // 2026-10-23 ÄNDERUNG Ende: HZG Powerbetrieb
          // PRIORITÄT 0: Alle Ventile geschlossen
          if (!id(ventil_offen).state) {
            id(letzte_prioritaet) = 80;
            ESP_LOGI("regelung", "P80 Alle Ventile zu -> Regelung pausiert");
            id(pid_integral) = 0.0f;
            // 2026-10-12 ÄNDERUNG Anfang: bei heißem Zulauf den Mischer auf die Startposition vorstellen, damit der Anlauf nicht überschwingt
            // 2026-10-12 Bei kaltem Zulauf bleibt es beim bisherigen Verhalten (Mischer anhalten, Position halten)
            if (zl - soll_vl > 15.0f) {
              int start = (int) roundf(id(pos_start).state);
              id(pos_ziel) = (float) start;
              if (fabsf(pos_ist - (float) start) > 2.0f) {
                id(mischer_fahre_position).execute(start);
                id(mischer_position_ms) = start * 1200;
              }
            } else {
              id(ha_mischer_stop).execute();
            }
            // 2026-10-12 ÄNDERUNG Ende: Startposition bei P80
            return;
          }

          // PRIORITÄT 1: Heizgrenze
          if (at >= id(heizgrenze_at).state) {
            id(letzte_prioritaet) = 70;
            ESP_LOGI("regelung", "P70: Heizgrenze erreicht (AT=%.1f) -> Mischer ZU", at);
            id(pid_integral) = 0.0f;
            id(ha_mischer_stop).execute();
            id(ha_mischer_zu).execute();
            return;
          }

          // PRIORITÄT 2: Vorlauf-Max Schutz
          if (vl >= id(vorlauf_max).state) {
            id(letzte_prioritaet) = 60;
            ESP_LOGW("regelung", "P60: Vorlauf-Max erreicht (VL=%.1f) -> sofort ZU", vl);
            id(pid_integral) = 0.0f;
            id(ha_mischer_stop).execute();
            id(ha_mischer_zu).execute();
            return;
          }

          // PRIORITÄT 3: Kessel-Schutz
          if (zl < id(kessel_min).state) {
            id(letzte_prioritaet) = 50;
            ESP_LOGW("regelung", "P50: Kessel kann nicht liefern (ZL=%.1f) -> nicht öffnen", zl);
            id(pid_integral) = 0.0f;
            id(ha_mischer_stop).execute();
            return;
          }

          // 2026-10-12 ÄNDERUNG Anfang: Totband auf dem Fehler (+-1 K) statt auf dem Positionsschritt, Zielposition als Float, Untergrenze im Regelbetrieb
          const float totband = 1.0f;
          if (fabsf(fehler) < totband) {
            id(letzte_prioritaet) = 0;
            ESP_LOGI("regelung", "P0: Fehler im Totband (%.2f K) -> nichts tun", fehler);
            return;
          }

          // 2026-10-12 Positionsschritt pro Zyklus in %, begrenzt auf +-2 %
          float delta = max(-2.0f, min(2.0f, id(pid_kp).state * fehler));
          float pos_alt = id(pos_ziel);
          // 2026-10-12 Die Untergrenze pos_min gilt nur nach unten, aus einer Stellung darunter wird nicht nach oben gezwungen
          float untergrenze = min(id(pos_min).state, pos_alt);
          id(pos_ziel) = max(untergrenze, min(100.0f, pos_alt + delta));
          int ziel = (int) roundf(id(pos_ziel));
          if (ziel == (int) roundf(pos_alt)) {
            id(letzte_prioritaet) = 0;
            ESP_LOGI("regelung", "P0: Zielposition %.2f%% -> noch %d%%, nichts zu senden", id(pos_ziel), ziel);
            return;
          }

          id(letzte_prioritaet) = (delta > 0) ? 1 : -1;
          ESP_LOGI("regelung", "P%d: Fehler=%.2f K -> Zielposition %d%% (Ist %.1f%%)",
                   id(letzte_prioritaet), fehler, ziel, pos_ist);
          id(mischer_fahre_position).execute(ziel);
          id(mischer_position_ms) = ziel * 1200;
          id(letzte_fahrtrichtung) = (delta > 0) ? 1 : -1;
          // 2026-10-12 ÄNDERUNG Ende: Totband auf dem Fehler, Float-Zielposition, Untergrenze

interval:
  - interval: 15s
    then:
      - logger.log: 'Dallas'
      - component.update: raumtemp
      - component.update: zulauf
      - component.update: ruecklauf
      - component.update: vorlauf
      - delay: 850ms        # warten bis Dallas-Konversion fertig
      - component.update: vl_rl_diff
      - logger.log: 'Puffer'
      - script.execute: puffer_schreiben
      - script.wait: puffer_schreiben
      - logger.log: 'Trend'
      - component.update: zl_trend_sensor
      - component.update: vl_trend      
      - component.update: soll_vorlauf      
      # 2026-10-23 ÄNDERUNG Anfang: HZG äußerer Kreis vor der Regelung ausführen
      - script.execute: hzg_aussen
      - script.wait: hzg_aussen
      # 2026-10-23 ÄNDERUNG Ende: HZG äußerer Kreis
      - logger.log: 'Regelung'
      - script.execute: regelung
      - script.wait: regelung
      - logger.log: 'Result'
      - component.update: mischer_letzte_prioritaet      
      - component.update: pid_ausgang_sensor
      - component.update: sollvorlauf_korrigiert
      - component.update: mischer_position
      - component.update: mischer_anschlag
      # 2026-10-23 ÄNDERUNG Anfang: HZG Sensoren aktualisieren
      - component.update: hzg_soll_raum_s
      - component.update: hzg_raumfehler_s
      - component.update: hzg_korrektur_s
      - component.update: hzg_soll_vl_s
      - component.update: hzg_aufheizzeit_s
      - component.update: hzg_modus_ts
      # 2026-10-23 ÄNDERUNG Ende: HZG Sensoren aktualisieren
      - homeassistant.event:
          event: esphome.heizung_messung
          data:
            vorlauf: !lambda "return id(vorlauf).state;"
            ruecklauf: !lambda "return id(ruecklauf).state;"
            zulauf: !lambda "return id(zulauf).state;"
            soll_vl: !lambda "return id(soll_vorlauf).state;"
            pid_ausgang: !lambda "return id(pid_letzter_ausgang);"
            mischer_pos: !lambda "return id(mischer_position_ms) / 1200.0;"
            prioritaet: !lambda "return id(letzte_prioritaet);"
            vl_rl_diff: !lambda "return id(vorlauf).state - id(ruecklauf).state;"
            zl_trend: !lambda "return (id(zl_prev2) > 0.0f) ? (id(zulauf).state - id(zl_prev2)) * 2.0f : 0.0f;"
            aussentemp: !lambda "return id(aussentemp).state;"
            # 2026-10-12 ÄNDERUNG Anfang: zusätzliche Logwerte (in der CSV-Automation hinten anhängen)
            pos_ist: !lambda "return isnan(id(rollaktor1_position_ist).state) ? -1.0f : id(rollaktor1_position_ist).state;"
            vl_trend: !lambda "return isnan(id(vl_trend).state) ? 0.0f : id(vl_trend).state;"
            # 2026-10-12 ÄNDERUNG Ende: zusätzliche Logwerte
            # 2026-10-22 ÄNDERUNG Anfang: Raumtemperatur Wohnzimmer mitloggen (als letzte Spalte der CSV)
            egwz_raumtemp: !lambda "return id(egwz_raumtemp).state;"
            # 2026-10-22 ÄNDERUNG Ende: Raumtemperatur Wohnzimmer mitloggen
            # 2026-10-23 ÄNDERUNG Anfang: Stand deiner Version vom 14.10. (Override und Zielposition, falls bei dir schon vorhanden bitte nur eine Kopie behalten)
            override: !lambda "return id(override_aktiv).state ? 1 : 0;"
            pos_ziel: !lambda "return id(pos_ziel);"
            # 2026-10-23 ÄNDERUNG Ende: Stand deiner Version vom 14.10.
            # 2026-10-23 ÄNDERUNG Anfang: HZG Logwerte (in der CSV-Automation hinten anhängen, Reihenfolge wie hier)
            hzg_soll_raum: !lambda "return id(hzg_soll_raum);"
            hzg_korrektur: !lambda "return id(hzg_korr);"
            hzg_soll_vl: !lambda "return id(hzg_soll_vl_eff);"
            hzg_modus: !lambda "return id(hzg_modus_ts).state;"
            hzg_bewoelkung: !lambda "return isnan(id(hzg_bewoelkung).state) ? -1.0f : id(hzg_bewoelkung).state;"
            hzg_wind: !lambda "return isnan(id(hzg_wind).state) ? -1.0f : id(hzg_wind).state;"
            # 2026-10-23 ÄNDERUNG Ende: HZG Logwerte
            # 2026-10-23 ÄNDERUNG Anfang: Fensterkontakt und einstellbare Parameter mitloggen (in der CSV-Automation hinten anhängen, Reihenfolge wie hier)
            fenster: !lambda "return id(hzg_fenster).state ? 1 : 0;"
            hk_neigung: !lambda "return id(hk_neigung).state;"
            hk_offset: !lambda "return id(hk_offset).state;"
            pid_kp: !lambda "return id(pid_kp).state;"
            vl_horizont: !lambda "return id(vl_horizont).state;"
            pos_min: !lambda "return id(pos_min).state;"
            pos_start: !lambda "return id(pos_start).state;"
            vorlauf_max: !lambda "return id(vorlauf_max).state;"
            kessel_min: !lambda "return id(kessel_min).state;"
            heizgrenze: !lambda "return id(heizgrenze_at).state;"
            hzg_wunsch: !lambda "return id(hzg_wunschtemp).state;"
            hzg_absenkung: !lambda "return id(hzg_absenkung).state;"
            hzg_aktiv: !lambda "return id(hzg_regelung_aktiv).state ? 1 : 0;"
            # 2026-10-23 ÄNDERUNG Ende: Fensterkontakt und Parameter
