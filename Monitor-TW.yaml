  - platform: homeassistant
    name: "Außentemperatur"
    entity_id: sensor.tempext
    id: aussentemp
    state_class: measurement

  # 2026-10-22 ÄNDERUNG Anfang: Raumtemperatur Wohnzimmer (Führungsraum), bewusst ungefiltert, ein Filter gehört zum echten Sensor in die äußere Regelung
  # 2026-10-22 Die Quelle steht oben unter substitutions (raumtemp_quelle), beim Sensortausch nur dort ändern
  - platform: homeassistant
    name: "EGWZ Raumtemp"
    id: egwz_raumtemp
    entity_id: ${raumtemp_quelle}
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    # 2026-10-22 Sensoren der Plattform homeassistant sind standardmäßig intern, erst internal: false legt die Entität in HA an (stabiler Name samt Statistik über den Sensortausch hinweg)
    internal: false
  # 2026-10-22 ÄNDERUNG Ende: Raumtemperatur Wohnzimmer

  - platform: homeassistant   
    name: "Rollaktor1 Position (Ist)"
    id: rollaktor1_position_ist
    entity_id: cover.rollaktor1
    attribute: current_position
    state_class: measurement

  - platform: template
    name: "VL-RL Differenz"
    id: vl_rl_diff
    unit_of_measurement: "°C"
    update_interval: never
    lambda: |-
      if (isnan(id(vorlauf).state) || isnan(id(ruecklauf).state)) return NAN;
      return id(vorlauf).state - id(ruecklauf).state;

  - platform: template
    name: "Heizkurve Sollvorlauf"
    id: soll_vorlauf
    unit_of_measurement: "°C"
    update_interval: never
    state_class: measurement
    device_class: temperature
    lambda: |-
      if (isnan(id(aussentemp).state)) return NAN;
      float x = id(aussentemp).state;
      float N = id(hk_neigung).state;
      float L = id(hk_offset).state;
      float a = -0.015625f * N;
      float b = -0.9375f * N + 0.05f;
      float c = 25.0f * N + 21.0f;
      float u = (20.0f * x) / L;  // (20*x)/L
      return a * u * u + b * u + c + (L - 20.0f);

  - platform: template
    name: "Vorlauf Trend"
    id: vl_trend
    unit_of_measurement: "°C/3min"
    update_interval: never
    state_class: measurement
    lambda: |-
      if (id(puffer_gefuellt) < 12) return NAN;
      float werte[12] = {
        id(vl_h0),  id(vl_h1),  id(vl_h2),
        id(vl_h3),  id(vl_h4),  id(vl_h5),
        id(vl_h6),  id(vl_h7),  id(vl_h8),
        id(vl_h9),  id(vl_h10), id(vl_h11)
      };
      int idx = id(vl_idx);
      // 2026-10-12 ÄNDERUNG Anfang: Indizes korrigiert, vl_idx zeigt nach puffer_schreiben auf den ältesten Wert, der neueste liegt davor
      float aeltester = werte[idx];
      float neuester  = werte[(idx + 11) % 12];
      // 2026-10-12 ÄNDERUNG Ende: Indizes korrigiert
      return neuester - aeltester;

  - platform: template
    name: "Mischer Position"
    id: mischer_position
    unit_of_measurement: "%"
    update_interval: never
    state_class: measurement
    lambda: |-
      return (float)id(mischer_position_ms) / 1200.0;

  - platform: template
    name: "Mischer Anschlag"
    id: mischer_anschlag
    update_interval: never
    lambda: |-
      int pos = id(mischer_position_ms);
      if (pos <= 0) return 1.0;    // Anschlag ZU
      if (pos >= 120000) return 2.0; // Anschlag AUF
      return 0.0;                   // frei

  - platform: template
    name: "Mischer Letzte Priorität"
    id: mischer_letzte_prioritaet
    update_interval: never
    state_class: measurement
    lambda: |-
      return id(letzte_prioritaet);
  
  - platform: template
    name: "PID Ausgang"
    id: pid_ausgang_sensor
    unit_of_measurement: "°C"
    update_interval: never
    state_class: measurement
    lambda: return id(pid_letzter_ausgang);

  - platform: template
    name: "Sollvorlauf korrigiert"
    id: sollvorlauf_korrigiert
    unit_of_measurement: "°C"
    update_interval: never
    state_class: measurement
    device_class: temperature
    lambda: return id(soll_vl_korrigiert);

  - platform: template
    name: "Zulauf Trend"
    id: zl_trend_sensor
    unit_of_measurement: "°C/min"
    update_interval: never
    state_class: measurement
    lambda: |-
      if (id(zl_prev2) == 0.0f) return NAN;
      return (id(zulauf).state - id(zl_prev2)) * 2.0f;  // °C/min bei 30s Fenster

  
  # 2026-10-23 ÄNDERUNG Anfang: HZG Sensoren der Raumregelung
  - platform: template
    name: "HZG_Soll_Raum"
    id: hzg_soll_raum_s
    unit_of_measurement: "°C"
    update_interval: never
    state_class: measurement
    device_class: temperature
    lambda: return id(hzg_soll_raum);

  - platform: template
    name: "HZG_Raumfehler"
    id: hzg_raumfehler_s
    unit_of_measurement: "K"
    update_interval: never
    state_class: measurement
    lambda: return id(hzg_fehler);

  - platform: template
    name: "HZG_Korrektur"
    id: hzg_korrektur_s
    unit_of_measurement: "K"
    update_interval: never
    state_class: measurement
    lambda: return id(hzg_korr);

  - platform: template
    name: "HZG_Soll_VL"
    id: hzg_soll_vl_s
    unit_of_measurement: "°C"
    update_interval: never
    state_class: measurement
    device_class: temperature
    lambda: return id(hzg_soll_vl_eff);

  - platform: template
    name: "HZG_Aufheizzeit"
    id: hzg_aufheizzeit_s
    unit_of_measurement: "min"
    update_interval: never
    state_class: measurement
    lambda: return id(hzg_aufheiz_min);

  # 2026-10-23 Wetter aus weather.openweathermap, vorerst nur zum Mitloggen und für die Auswertung
  - platform: homeassistant
    name: "HZG_Bewoelkung"
    id: hzg_bewoelkung
    entity_id: weather.openweathermap
    attribute: cloud_coverage
    unit_of_measurement: "%"
