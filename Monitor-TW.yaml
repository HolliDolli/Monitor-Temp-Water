  # 2026-10-23 ÄNDERUNG Ende: HZG Zustand der Raumregelung
number:

  - platform: template
    name: "Heizung Neigung N"
    id: hk_neigung
    min_value: 0.2
    max_value: 2.0
    step: 0.1
    initial_value: 1.3
    optimistic: true
    restore_value: true

  - platform: template
    name: "Heizung Offset L"
    id: hk_offset
    min_value: 10.0
    max_value: 30.0
    step: 1.0
    initial_value: 18.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"

  - platform: template
    name: "Override Schrittweite ms"
    id: override_schrittweite
    min_value: 500
    max_value: 30000
    step: 500
    initial_value: 3000
    optimistic: true
    restore_value: true
    unit_of_measurement: "ms"

  - platform: template
    name: "Trend Schwelle"
    id: trend_schwelle
    min_value: 0.1
    max_value: 2.0
    step: 0.1
    initial_value: 0.5
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C/3min"

  - platform: template
    name: "Heizgrenze AT"
    id: heizgrenze_at
    min_value: 10.0
    max_value: 22.0
    step: 0.5
    initial_value: 17.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"

  - platform: template
    name: "Vorlauf Max"
    id: vorlauf_max
    min_value: 40.0
    max_value: 90.0
    step: 1.0
    initial_value: 75.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"

  - platform: template
    name: "Kessel Mindesttemperatur"
    id: kessel_min
    min_value: 20.0
    max_value: 60.0
    step: 1.0
    initial_value: 40.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"

  # 2026-10-12 ÄNDERUNG Anfang: Kp ist jetzt die Positionsänderung in % pro 15-s-Zyklus und Kelvin Fehler (Startwert 0.1)
  # 2026-10-12 ACHTUNG: restore_value stellt nach dem Flashen den alten Wert (0.5) wieder her, daher Kp einmalig in HA auf 0.1 setzen
  - platform: template
    name: "PID Kp"
    id: pid_kp
    min_value: 0.02
    max_value: 0.3  # 2026-10-23 Kp-Bereich begrenzt (Stand deiner Version vom 14.10.)
    step: 0.01
    initial_value: 0.1
    optimistic: true
    restore_value: true
  # 2026-10-12 ÄNDERUNG Ende: Kp

  # 2026-10-12 ÄNDERUNG Anfang: neue Parameter für Prädiktion, Untergrenze und Startposition
  - platform: template
    name: "Vorlauf Horizont"
    id: vl_horizont
    min_value: 0.0
    max_value: 2.0
    step: 0.1
    initial_value: 1.0
    optimistic: true
    restore_value: true

  - platform: template
    name: "Mischer Min Position"
    id: pos_min
    min_value: 0.0
    max_value: 60.0
    step: 1.0
    initial_value: 45.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"

  - platform: template
    name: "Mischer Startposition"
    id: pos_start
    min_value: 0.0
    max_value: 100.0
    step: 1.0
    initial_value: 60.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
  # 2026-10-12 ÄNDERUNG Ende: neue Parameter

  # 2026-10-12 HINWEIS: PID Ki und PID Kd werden seit der Änderung nicht mehr verwendet, bewusst nicht entfernt, damit die HA-Entitäten nicht verwaisen
  - platform: template
    name: "PID Ki"
    id: pid_ki
    min_value: 0.0
    max_value: 0.01
    step: 0.001
    initial_value: 0.005
    optimistic: true
    restore_value: true

  - platform: template
    name: "PID Kd"
    id: pid_kd
    min_value: 0.0
    max_value: 2.0
    step: 0.05
    initial_value: 0.3
    optimistic: true
    restore_value: true
  
  # 2026-10-23 ÄNDERUNG Anfang: HZG Einstellungen der Raumregelung
  - platform: template
    name: "HZG_Wunschtemp"
    id: hzg_wunschtemp
    min_value: 17.0
    max_value: 23.0
    step: 0.5
    initial_value: 21.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "°C"

  - platform: template
    name: "HZG_Absenkung"
    id: hzg_absenkung
    min_value: 0.0
    max_value: 10.0
    step: 0.5
    initial_value: 3.0
    optimistic: true
    restore_value: true
    unit_of_measurement: "K"

  - platform: template
    name: "HZG_Power_Dauer"
    id: hzg_power_dauer
    min_value: 10
    max_value: 240
    step: 10
    initial_value: 60
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
  # 2026-10-23 ÄNDERUNG Ende: HZG Einstellungen der Raumregelung

# 2026-10-23 ÄNDERUNG Anfang: HZG Heizzeit (täglich, ohne Wochenendprofil)
datetime:
  - platform: template
    name: "HZG_Heizzeit_von"
    id: hzg_heizzeit_von
    type: time
    optimistic: true
    initial_value: "06:00:00"
    restore_value: true

  - platform: template
    name: "HZG_Heizzeit_bis"
    id: hzg_heizzeit_bis
    type: time
    optimistic: true
    initial_value: "22:00:00"
    restore_value: true
# 2026-10-23 ÄNDERUNG Ende: HZG Heizzeit
esp32_touch:
  setup_mode: false    
  low_voltage_reference: 0.8V  # One of 0.5V, 0.6V, 0.7V, 0.8V. Default is 0.5V.
  high_voltage_reference: 2.4V    # One of 2.4V, 2.5V, 2.6V, 2.7V. Default is 2.7V.
  voltage_attenuation: 0V    # One of 1.5V, 1V, 0.5V, 0V. Default is 0V.
  
one_wire:
  - platform: gpio
    pin: GPIO26

output:
  - platform: gpio
    pin: GPIO22
    id: 'GPLEDint'

switch:
  - platform: output
    id: "LEDint"
    name: "LEDint"
    output: "GPLEDint"
    inverted: true
    restore_mode: ALWAYS_ON
  - platform: restart
    name: "Monitor-TW Restart" 
    
  - platform: gpio
    pin: 32
    name: "Mischer Auf"
    id: mischer_auf
    interlock: [mischer_zu]
    interlock_wait_time: 200ms

  - platform: gpio
    pin: 33
    name: "Mischer Zu"
    id: mischer_zu
    interlock: [mischer_auf]
    interlock_wait_time: 200ms

  - platform: template
    name: "Mischer Override aktiv"
    id: override_aktiv
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.stop: regelung
      - script.stop: fahre_auf
      - script.stop: fahre_zu
      - switch.turn_off: mischer_auf
      - switch.turn_off: mischer_zu
      - logger.log: "Override aktiviert – Automatik gestoppt"
    on_turn_off:
      - logger.log: "Override deaktiviert – Automatik läuft wieder"

  # 2026-10-23 ÄNDERUNG Anfang: HZG Raumregelung ein/aus (aus = reine Heizkurve)
  - platform: template
    name: "HZG_Regelung_aktiv"
    id: hzg_regelung_aktiv
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  # 2026-10-23 ÄNDERUNG Ende: HZG Raumregelung ein/aus
select:
  - platform: template
    name: "Mischer Override Richtung"
    id: override_richtung
    optimistic: true
    options:
      - "STOP"
      - "AUF"
      - "ZU"
    initial_option: "STOP"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            if (!id(override_aktiv).state) return;
            auto val = id(override_richtung).current_option();
            if (val == "AUF") {
              id(fahre_auf).execute();
            } else if (val == "ZU") {
              id(fahre_zu).execute();
            } else {
              id(mischer_auf).turn_off();
              id(mischer_zu).turn_off();
            }

  
  # 2026-10-23 ÄNDERUNG Anfang: HZG Betriebsmodus
  - platform: template
    name: "HZG_Betriebsmodus"
    id: hzg_betriebsmodus
    optimistic: true
    options:
      - "Regelbetrieb"
      - "Partybetrieb"
      - "Powerbetrieb"
    initial_option: "Regelbetrieb"
    restore_value: true
    on_value:
      then:
        - lambda: |-
            if (i == 2) id(hzg_power_start) = millis();
  # 2026-10-23 ÄNDERUNG Ende: HZG Betriebsmodus
text_sensor:
  - platform: version
    name: "ESPHome Version"

  # 2026-10-23 ÄNDERUNG Anfang: HZG gelernte Tabelle aus HA lesen (nur einmal nach dem Start), Format: t0;t1;t2;t3;t4;t5;Aufheizfaktor
  # 2026-10-23 Wird der Helper von Hand geändert, danach den ESP neu starten, sonst überschreibt der ESP die Änderung beim nächsten Sichern
  - platform: homeassistant
    id: hzg_tab_ha
    entity_id: input_text.hzg_lerntabelle
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(hzg_geladen)) return;
            if (x == "unavailable") return;
            if (x == "" || x == "unknown") {
              id(hzg_geladen) = true;
              id(hzg_save_ms) = millis();
              ESP_LOGI("hzg", "Lerntabelle in HA leer, Start mit Nullwerten");
              return;
            }
            float v[7];
            int n = sscanf(x.c_str(), "%f;%f;%f;%f;%f;%f;%f", &v[0], &v[1], &v[2], &v[3], &v[4], &v[5], &v[6]);
            if (n != 7) {
              ESP_LOGW("hzg", "Lerntabelle in HA unlesbar (%d Werte): %s", n, x.c_str());
              return;
            }
            for (int k = 0; k < 6; k++) id(hzg_tab)[k] = max(-15.0f, min(15.0f, v[k]));
            id(hzg_k_auf) = max(10.0f, min(120.0f, v[6]));
            // 2026-10-23 Korrektur: geladene Werte als "zuletzt gesichert" merken, sonst schreibt der ESP nach 30 min ungeändert zurück
            char buf[80];
            snprintf(buf, sizeof(buf), "%.2f;%.2f;%.2f;%.2f;%.2f;%.2f;%.1f",
                     id(hzg_tab)[0], id(hzg_tab)[1], id(hzg_tab)[2], id(hzg_tab)[3], id(hzg_tab)[4], id(hzg_tab)[5], id(hzg_k_auf));
            id(hzg_save_str) = std::string(buf);
            id(hzg_geladen) = true;
            id(hzg_save_ms) = millis();
            ESP_LOGI("hzg", "Lerntabelle aus HA geladen: %s", x.c_str());
  # 2026-10-23 ÄNDERUNG Ende: HZG gelernte Tabelle aus HA lesen

  # 2026-10-23 ÄNDERUNG Anfang: HZG Modus als Text
  - platform: template
    name: "HZG_Modus"
    id: hzg_modus_ts
    update_interval: never
    lambda: |-
      switch (id(hzg_modus_nr)) {
        case 1: return std::string("Heizen");
        case 2: return std::string("Absenken");
        case 3: return std::string("Aufheizen");
        case 4: return std::string("Party");
        case 5: return std::string("Power");
        case 6: return std::string("Fallback");
        default: return std::string("Aus");
      }
  # 2026-10-23 ÄNDERUNG Ende: HZG Modus als Text
binary_sensor:
  - platform: status
    name: "Statussensor"
    id: statussensor
    
  - platform: esp32_touch
    name: "esp32touchpad"
    id: "esp32touchpad"
    pin: GPIO14
    threshold: 110
    on_press:
      then:
        - component.update: touch_raw_sensor
  - platform: template
    name: "Mischer Anschlag ZU"
    id: anschlag_zu
    lambda: return id(mischer_position_ms) <= 0;

  - platform: template
    name: "Mischer Anschlag AUF"
    id: anschlag_auf
    lambda: return id(mischer_position_ms) >= 120000;
 
  - platform: homeassistant
    id: ventil_offen
    entity_id: binary_sensor.heizung_mindestens_ein_ventil_offen

 
  # 2026-10-23 ÄNDERUNG Anfang: HZG Fensterkontakt Wohnzimmer (EGW-FK), nur intern, keine neue Entität in HA
  - platform: homeassistant
    id: hzg_fenster
    entity_id: binary_sensor.hmip_swdo_0000dbe9a0a37d_state
  # 2026-10-23 ÄNDERUNG Ende: HZG Fensterkontakt

  # 2026-10-23 ÄNDERUNG Anfang: HZG Lernen freigegeben
  - platform: template
    name: "HZG_Lernen_aktiv"
    id: hzg_lernen_bs
    lambda: return id(hzg_lernen);
  # 2026-10-23 ÄNDERUNG Ende: HZG Lernen freigegeben
sensor:  
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""
  - platform: dallas_temp
#    address: 0xd47b8b008607c028 # brauchen wir nicht mehr. gibt ja jetzt index :-)
    index: 0
