esp32:
  board: lolin32_lite
  framework:
    type: esp-idf
  
esphome:
  name: monitor-tw
  on_boot:
    priority: -100.0
    then:
      - logger.log: 'HTMon boot triggered'
      - switch.turn_on: LEDint
# hier tauschen wenn deepsleep aktiviert werden soll, und unten bei interval
#      - script.execute: consider_deep_sleep
      - deep_sleep.prevent: deep_sleep_1
      - logger.log: "Boot: Mischer wird komplett zugefahren"
      - switch.turn_on: mischer_zu
      - delay: 125000ms   # 125s um sicher am Anschlag zu sein
      - switch.turn_off: mischer_zu
      - lambda: id(mischer_position_ms) = 0;
      - logger.log: "Boot: Mischer ist ganz zu, Position = 0"
  on_shutdown:
    priority: -100.0
    then:
      - switch.turn_off: LEDint
      - logger.log: "HTMon shutdown triggered"


# Enable logging
logger:

wifi:
  networks:
  - ssid: !secret GKssid
    password: !secret GKpassword
  - ssid: !secret BGssid
    password: !secret BGpassword
  - ssid: !secret SSssid
    password: !secret SSpassword
  ap:
    ssid: !secret FBssid
    password: !secret FBpassword

  # Enable fallback hotspot (captive portal) in case wifi connection fails
captive_portal:


ota:
  - platform: esphome

# Enable Home Assistant API
#
# Achtung: Für Offlinekalender muss der API-Reboot auf 0s gesetzt werden, da die Tonne sonst alle 15 Minuten neu startet.
#
api:
  reboot_timeout: 60min  # only enable this when creating an offline device; 0s=never reboot


  
time:
  - platform: homeassistant

sun:
  latitude: 51.14°
  longitude: 9.414°
  
globals:
