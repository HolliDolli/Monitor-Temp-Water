# 2026-10-22 ÄNDERUNG Anfang: Quelle der Raumtemperatur an einer Stelle, Tausch gegen den echten Raumsensor = nur diese Zeile ändern
substitutions:
  raumtemp_quelle: sensor.grp_wz_int0000003_temperature
  # 2026-10-23 ÄNDERUNG Anfang: HZG Untergrenze der Raum-Solltemperatur (Absenkung), Frostschutz
  HZG_FROST_MIN: "12.0"
  # 2026-10-23 ÄNDERUNG Ende: HZG Untergrenze
# 2026-10-22 ÄNDERUNG Ende: Quelle der Raumtemperatur

esp32:
  board: lolin32_lite
  framework:
    type: esp-idf

esphome:
  name: monitor-tw
    
  on_boot:
    priority: -100.0
    then:
      - logger.log: 'HTMon boot triggered'
      - switch.turn_on: LEDint
      # Mischer init, bruachen wir nicht mehr, haben ja jetzt echte Position
      #- logger.log: "Boot: Mischer wird komplett zugefahren"
      #- wait_until:
      #    api.connected:
      #- delay: 5000ms
      #- logger.log: "API verbunden, fahre Mischer zu"
      #- homeassistant.service:
      #    service: cover.close_cover
      #    data:
      #      entity_id: cover.rollaktor1
      #- delay: 125000ms
      #- homeassistant.service:
      #    service: cover.stop_cover
      #    data:
      #      entity_id: cover.rollaktor1
      #- lambda: id(mischer_position_ms) = 0;
      #- logger.log: "Boot: Mischer ist ganz zu, Position = 0"
      - lambda: id(boot_fertig) = true;
      # 2026-10-23 ÄNDERUNG Anfang: HZG Powerbetrieb fällt nach einem Neustart auf Regelbetrieb zurück
      - lambda: |-
          if (id(hzg_betriebsmodus).active_index().value_or(0) == 2) {
            id(hzg_betriebsmodus).make_call().set_index(0).perform();
          }
      # 2026-10-23 ÄNDERUNG Ende: HZG Powerbetrieb nach Neustart
  on_shutdown:
    priority: -100.0
    then:
      - switch.turn_off: LEDint
      - logger.log: "HTMon shutdown triggered"


# Enable logging
logger:

wifi:
  networks:
  - ssid: !secret GKssid
    password: !secret GKpassword
  - ssid: !secret BGssid
    password: !secret BGpassword
  - ssid: !secret SSssid
    password: !secret SSpassword
  ap:
    ssid: !secret FBssid
    password: !secret FBpassword

  # Enable fallback hotspot (captive portal) in case wifi connection fails
captive_portal:


ota:
  - platform: esphome

# Enable Home Assistant API
#
# Achtung: Für Offlinekalender muss der API-Reboot auf 0s gesetzt werden, da die Tonne sonst alle 15 Minuten neu startet.
#
api:
  reboot_timeout: 60min  # only enable this when creating an offline device; 0s=never reboot


  
time:
