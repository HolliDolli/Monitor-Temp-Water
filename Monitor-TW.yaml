    type: float
    restore_value: false
    initial_value: '0.0'
  - id: vl_h3
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: vl_h4
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: vl_h5
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: vl_h6
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: vl_h7
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: vl_h8
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: vl_h9
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: vl_h10
